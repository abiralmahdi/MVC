# MarksVision (MVC) - Portainer stack (builds the image from this Git repo)
#
# In Portainer:  Stacks -> Add stack -> name "marksvision" -> Build method: Repository
#   Repository URL : https://github.com/abiralmahdi/MVC.git
#   Reference      : refs/heads/fix/security-stability-overhaul
#   Compose path   : deploy/portainer-stack.yml
# Then set the env vars below (in the stack's "Environment variables" section or inline),
# and click "Deploy the stack". Portainer clones the repo and builds the image on that host.
#
# Edit the three values marked  <-- CHANGE  before deploying.

services:
  web:
    build:
      context: ..                 # repo root (where the Dockerfile is), relative to this file
      dockerfile: Dockerfile
    image: marksvision:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: "change-me-to-a-long-random-string"   # <-- CHANGE
      DJANGO_ALLOWED_HOSTS: "192.168.1.50"                     # <-- CHANGE to the Portainer PC's IP/hostname
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://192.168.1.50:8000"  # <-- CHANGE (same IP, keep http://...:8000)
      MVC_DB_PATH: "/data/db.sqlite3"
      # --- optional: real email alerts (otherwise alerts just print to the container log) ---
      # DJANGO_EMAIL_HOST: "smtp.gmail.com"
      # DJANGO_EMAIL_HOST_USER: "you@example.com"
      # DJANGO_EMAIL_HOST_PASSWORD: "app-password"
      # DJANGO_DEFAULT_FROM_EMAIL: "MarksVision Alerts <you@example.com>"
    volumes:
      - mvc_db:/data                # sqlite database   (persists across rebuilds)
      - mvc_media:/app/media        # uploaded files (profile pictures, reports)
      - mvc_ml:/app/ml_artifacts    # trained ML models + cached datasets

  # Optional background meter poller. Enable ONLY if the meters are reachable
  # from the Portainer PC's network. Shares the same database as the web app.
  # poller:
  #   build:
  #     context: ..
  #     dockerfile: Dockerfile
  #   image: marksvision:latest
  #   restart: unless-stopped
  #   command: python manage.py poll_modbus
  #   environment:
  #     MVC_DB_PATH: "/data/db.sqlite3"
  #   volumes:
  #     - mvc_db:/data
  #     - mvc_ml:/app/ml_artifacts

volumes:
  mvc_db:
  mvc_media:
  mvc_ml:
