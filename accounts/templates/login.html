{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b11">
  <title>Sign in - MarksVision</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'fontawesomefree/css/fontawesome.css' %}" rel="stylesheet" type="text/css">
  <link href="{% static 'fontawesomefree/css/solid.css' %}" rel="stylesheet" type="text/css">
  <link href="{% static 'style/mvc-theme.css' %}?v={{ ASSET_VERSION }}" rel="stylesheet" type="text/css">
  <style>
    body { display: grid; place-items: center; padding: 2rem 1rem; }
    body::before {
      content: "";
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(148, 163, 184, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.045) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 20%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 20%, transparent 75%);
      pointer-events: none;
    }
    .login-shell { position: relative; width: 100%; max-width: 410px; }
    .login-card { padding: 2.25rem 2rem 2rem; position: relative; overflow: hidden; }
    .login-card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: var(--mvc-accent-line); }
    .login-brand { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 1.75rem; }
    .login-brand .mvc-brand-mark { width: 52px; height: 52px; border-radius: 14px; font-size: 1.35rem; margin-bottom: 1rem; }
    .login-brand h1 { font-size: 1.35rem; margin: 0; }
    .login-brand p { color: var(--mvc-muted); font-size: 0.84rem; margin: 0.25rem 0 0; }
    .input-icon { position: relative; }
    .input-icon i { position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%); color: var(--mvc-muted); font-size: 0.85rem; pointer-events: none; }
    .input-icon .form-control { padding-left: 2.3rem; height: 44px; }
    .toggle-password { position: absolute; right: 0.4rem; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--mvc-muted); width: 34px; height: 34px; border-radius: 6px; }
    .toggle-password:hover { color: var(--mvc-accent); }
    .login-footer { text-align: center; color: var(--mvc-muted); font-size: 0.74rem; margin-top: 1.25rem; }
    .btn-login { height: 46px; font-size: 0.92rem; }
  </style>
</head>
<body>

  <main class="login-shell">
    <div class="mvc-panel login-card">
      <div class="login-brand">
        <span class="mvc-brand-mark"><i class="fa-solid fa-bolt"></i></span>
        <h1>MarksVision</h1>
        <p>Energy management suite · sign in to continue</p>
      </div>

      {% if error %}
      <div class="alert alert-danger py-2 d-flex align-items-center gap-2" role="alert"><i class="fa-solid fa-circle-exclamation"></i>{{ error }}</div>
      {% endif %}
      {% for message in messages %}
      <div class="alert alert-info py-2" role="alert">{{ message }}</div>
      {% endfor %}

      <form method="post" action="/accounts/login">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <div class="input-icon">
            <i class="fa-solid fa-user"></i>
            <input type="text" class="form-control" id="username" name="username" value="{{ username }}" placeholder="name@company.com" autocomplete="username" required autofocus>
          </div>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <div class="input-icon">
            <i class="fa-solid fa-lock"></i>
            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password"><i class="fa-solid fa-eye" style="position: static; transform: none;"></i></button>
          </div>
        </div>
        <button type="submit" class="btn btn-info btn-login w-100">Sign in <i class="fa-solid fa-arrow-right ms-2"></i></button>
      </form>
    </div>
    <p class="login-footer"><i class="fa-solid fa-shield-halved me-1"></i>Authorised personnel only · activity is logged</p>
  </main>

  <script>
    (function () {
      const input = document.getElementById('password');
      const button = document.getElementById('togglePassword');
      button.addEventListener('click', () => {
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        button.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        button.querySelector('i').className = show ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
      });
    })();
  </script>
</body>
</html>
